<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#C25210">
<title>SpeechHub Battle 2026</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23C25210'/%3E%3Cpath d='M20 22h24a4 4 0 0 1 4 4v12a4 4 0 0 1-4 4H32l-8 7v-7h-4a4 4 0 0 1-4-4V26a4 4 0 0 1 4-4z' fill='%23FFDA93'/%3E%3C/svg%3E">
<style>
  :root{
    /* гамма 25 ноября — «Окрась мир в оранжевый» (по back.jpg) */
    --bg:#C25210;          /* жженый оранжевый фон */
    --bg-deep:#9A3F0B;     /* окна */
    --panel:#A3440C;       /* поля и плитки на темном */
    --panel-hi:#B14B10;
    --line:rgba(255,218,147,.30);
    --orange:#D85808;      /* яркие ладони */
    --orange-hi:#E8701E;
    --orange-deep:#A3440C;
    --gold:#FFDA93;        /* лента */
    --gold-hi:#FFE6B3;
    --peach:#FFDDD1;       /* светлая ладонь */
    --white:#FFF6EE;
    --ink:#6E2A05;         /* темный текст на ленте */
    --red:#EF4444;
    --red-deep:#7F1D1D;
    --focus:#FFFFFF;
    --radius:28px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(1100px 600px at 15% -10%, rgba(216,88,8,.55), transparent 60%),
      radial-gradient(900px 500px at 100% 110%, rgba(153,75,27,.45), transparent 60%),
      var(--bg);
    background-attachment:fixed;
    color:var(--white);
    font-family:"Segoe UI","Inter",Roboto,"Helvetica Neue",Arial,sans-serif;
    display:flex;flex-direction:column;min-height:100%;overflow-x:hidden;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  button:focus-visible, a:focus-visible, input:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
  [hidden]{display:none !important}

  /* ---------- шапка ---------- */
  header{display:flex;align-items:center;gap:14px 22px;flex-wrap:wrap;padding:16px 32px 6px;flex:0 0 auto}
  .brand{display:flex;align-items:center;gap:12px;font-size:19px;font-weight:800;letter-spacing:.05em;white-space:nowrap}
  .brand .logo{
    width:36px;height:36px;border-radius:11px;flex:0 0 auto;background:var(--gold);
    display:grid;place-items:center;box-shadow:0 6px 18px rgba(110,42,5,.3);
  }
  .brand .logo svg{width:22px;height:22px}
  .brand .logo svg path{fill:var(--bg)}
  .brand span{color:var(--gold);font-weight:600;letter-spacing:.02em}
  nav.tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;flex:1 1 auto}
  .tab{
    display:inline-flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:999px;
    font-size:15px;font-weight:700;color:var(--white);
    box-shadow:inset 0 0 0 2px rgba(255,218,147,.40);
    transition:background .12s ease, transform .12s ease;
  }
  .tab b{
    width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;
    background:rgba(255,218,147,.22);color:var(--gold);font-size:14px;
  }
  .tab small{font-size:13px;font-weight:600;color:var(--gold)}
  .tab:hover:not(:disabled){background:rgba(255,218,147,.14)}
  .tab[aria-current="true"]{background:var(--gold);color:var(--ink);box-shadow:none}
  .tab[aria-current="true"] b{background:var(--ink);color:var(--gold)}
  .tab[aria-current="true"] small{color:var(--orange-deep)}
  .tab:disabled{opacity:.45;cursor:not-allowed}
  .head-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .chip{
    display:inline-flex;align-items:center;gap:8px;text-decoration:none;
    background:transparent;color:var(--white);box-shadow:inset 0 0 0 2px rgba(255,218,147,.55);
    border-radius:999px;padding:9px 16px;font-size:15px;font-weight:600;
    transition:transform .12s ease, background .12s ease, box-shadow .12s ease;
  }
  .chip:hover{background:rgba(255,218,147,.14);box-shadow:inset 0 0 0 2px var(--gold)}
  .chip:active{transform:scale(.96)}
  .chip.accent{background:var(--gold);color:var(--ink);box-shadow:none}
  .chip.accent:hover{background:var(--gold-hi)}
  .chip:disabled{opacity:.45;cursor:not-allowed}
  .chip svg{width:18px;height:18px;flex:0 0 auto}

  /* ---------- тур ---------- */
  main{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;gap:20px;padding:8px 32px 6px}
  .tour-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 24px;flex-wrap:wrap}
  .tour-head .kick{font-size:13px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
  .tour-head h1{font-size:clamp(24px,2.6vw,40px);font-weight:800;line-height:1.15;margin-top:4px}
  .tour-head p{font-size:16px;margin-top:6px}
  .tour-head p b{color:var(--gold)}

  .reels{display:grid;grid-template-columns:1fr 1fr;gap:24px}
  .reels.three{grid-template-columns:1fr minmax(240px,.72fr) 1fr}
  .reel{
    background:linear-gradient(180deg,#FFDF9E 0%,#FFD488 100%);color:var(--ink);
    border-radius:var(--radius);padding:56px 30px 34px;
    min-height:clamp(230px,36vh,360px);
    display:flex;flex-direction:column;justify-content:center;align-items:center;
    text-align:center;position:relative;overflow:hidden;
    transition:box-shadow .4s ease, background .4s ease;
  }
  .reel::before{
    content:"";position:absolute;left:0;right:0;top:0;height:5px;
    background:linear-gradient(90deg,var(--orange-deep),var(--orange),var(--orange-deep));
    opacity:.55;transition:opacity .4s ease;
  }
  .reel::after{
    content:"";position:absolute;inset:0;border-radius:var(--radius);
    box-shadow:inset 0 0 0 2px rgba(110,42,5,.12);pointer-events:none;
  }
  .reel .kicker{
    position:absolute;top:22px;left:30px;right:30px;
    display:flex;align-items:center;gap:8px;
    font-size:13px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--orange-deep);
  }
  .reel .kicker i{width:8px;height:8px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 4px rgba(216,88,8,.2);flex:0 0 auto}
  .reel .kicker em{margin-left:auto;font-style:normal;letter-spacing:.08em}
  .value{
    font-weight:800;line-height:1.12;word-break:break-word;hyphens:auto;width:100%;
    transition:filter .45s ease, opacity .3s ease, transform .45s cubic-bezier(.2,1.4,.4,1);
  }
  .spinning .value{filter:blur(12px);opacity:.85}
  .idle .value{filter:blur(8px);opacity:.3}
  .revealed .value{filter:blur(0);opacity:1;transform:scale(1.02)}
  .revealed{background:linear-gradient(180deg,#FFF1DE 0%,#FFE0C2 100%);box-shadow:0 18px 60px -18px rgba(110,42,5,.6)}
  .revealed::before{opacity:1}
  .revealed::after{box-shadow:inset 0 0 0 3px var(--orange)}

  .person{display:flex;flex-direction:column;align-items:center;gap:10px}
  .person + .person{margin-top:16px;padding-top:16px;border-top:2px dashed rgba(110,42,5,.22)}
  .person .nm{font-size:clamp(28px,3.6vw,56px);letter-spacing:-.01em}
  .mode-pair .person .nm{font-size:clamp(22px,2.5vw,38px)}

  /* тур 4: пары складываются в танце — оператор отмечает первую пару */
  .picker{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
  .pick-q{font-size:clamp(24px,2.4vw,38px);line-height:1.1}
  .pick-q small{display:block;font-size:clamp(14px,1.1vw,18px);font-weight:600;color:var(--orange-deep);margin-top:4px}
  .pick-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
  .pchip{
    padding:10px 20px;border-radius:999px;font-size:clamp(16px,1.35vw,21px);font-weight:700;color:var(--ink);
    background:rgba(255,255,255,.4);box-shadow:inset 0 0 0 2px rgba(110,42,5,.3);
  }
  .pchip:hover{background:rgba(255,255,255,.8)}
  .pchip:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
  .pchip.W[aria-pressed="true"]{background:var(--orange-deep);color:#fff;box-shadow:none}
  .pchip.M[aria-pressed="true"]{background:var(--ink);color:var(--gold);box-shadow:none}  .meta{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;font-size:15px;font-weight:600;color:var(--orange-deep)}
  .team{padding:3px 12px;border-radius:999px;font-size:14px;font-weight:700;letter-spacing:.02em}
  .team.W{background:var(--orange-deep);color:#fff}
  .team.M{background:var(--ink);color:var(--gold)}

  #taskValue{font-size:clamp(24px,2.9vw,44px);font-weight:700;line-height:1.2}
  .mode-story #taskValue{font-size:clamp(19px,2vw,30px);font-weight:600;line-height:1.35}
  .mode-order #taskValue{font-size:clamp(26px,3vw,46px)}
  .topic{font-size:clamp(22px,2.4vw,36px);font-weight:800;line-height:1.2}
  .words{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:18px}
  .words span{
    display:inline-flex;flex-direction:column;align-items:center;line-height:1.15;
    background:var(--ink);color:var(--gold);padding:6px 18px;border-radius:22px;font-size:clamp(16px,1.6vw,24px);font-weight:700;
  }
  .words span small{font-size:.6em;font-weight:600;opacity:.72}

  /* второй язык — субтитр: мельче и бледнее */
  .sec{font-size:.56em;font-weight:600;line-height:1.3;opacity:.68;margin-top:.6em}
  .title-sec{font-size:clamp(15px,1.3vw,20px);font-weight:600;color:var(--gold);margin-top:2px}
  .title-sec:empty{display:none}
  .chip.lang{gap:7px}
  .chip.lang b{color:var(--gold);letter-spacing:.04em}
  .chip.lang span{font-size:13px;opacity:.65}

  /* цветок */
  .flower-card{padding:44px 16px 16px}
  .flower-card svg{width:100%;height:100%;max-height:clamp(200px,31vh,320px)}
  .petal ellipse{fill:var(--orange);stroke:#FFE6B3;stroke-width:2;transition:fill .15s ease}
  .petal text{fill:#fff;font-size:15px;font-weight:800;text-anchor:middle;dominant-baseline:central}
  .petal.open ellipse{fill:#FFF6EE;stroke:#E8A070}
  .petal.open text{fill:#C98A5C}
  .petal.hot ellipse{fill:#FFE6B3}
  .petal.hot text{fill:var(--ink)}
  .petal.current ellipse{fill:#fff;stroke:var(--ink);stroke-width:3.5}
  .petal.current text{fill:var(--ink)}
  .flower-core{fill:var(--ink)}
  .flower-count{fill:var(--gold);font-size:17px;font-weight:800;text-anchor:middle;dominant-baseline:central}

  /* нижняя панель: кнопка и таймер */
  .bar{display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,600px);gap:24px;align-items:stretch}
  .controls{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
  .spin{
    display:inline-flex;align-items:center;gap:12px;
    background:linear-gradient(180deg,var(--gold-hi) 0%,var(--gold) 100%);color:var(--ink);
    font-size:26px;font-weight:800;letter-spacing:.03em;padding:20px 56px;border-radius:999px;
    box-shadow:0 10px 30px -8px rgba(110,42,5,.6), inset 0 -3px 0 rgba(110,42,5,.15);
    transition:transform .12s ease, filter .12s ease, box-shadow .12s ease;
  }
  .spin svg{width:26px;height:26px}
  .spin:hover{filter:brightness(1.04)}
  .spin:active{transform:scale(.97)}
  .spin[disabled]{background:rgba(255,218,147,.22);color:var(--gold);cursor:not-allowed;filter:none;box-shadow:none}
  .spin.busy svg{animation:turn 1s linear infinite}
  @keyframes turn{to{transform:rotate(360deg)}}
  .hint{font-size:15px;text-align:center;line-height:1.6}
  kbd{font-family:inherit;font-weight:700;color:var(--ink);background:var(--gold);border-radius:6px;padding:1px 7px}

  .timer{
    background:rgba(110,42,5,.42);border-radius:24px;box-shadow:inset 0 0 0 2px var(--line);
    padding:16px 20px 14px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 20px;align-items:center;
    grid-template-areas:"clock trow" "clock phases" "track track";
    cursor:zoom-in;transition:background .3s ease, box-shadow .3s ease, transform .15s ease;
  }
  .timer:hover{box-shadow:inset 0 0 0 2px var(--gold)}
  .timer .trow{grid-area:trow}
  .timer .clock{grid-area:clock}
  .timer .phases{grid-area:phases}
  .timer .track{grid-area:track}
  .stage-keys{display:none}
  .clock{
    font-size:clamp(52px,5.4vw,88px);font-weight:800;line-height:1;font-variant-numeric:tabular-nums;
    letter-spacing:-.02em;min-width:3.1ch;text-align:left;
  }
  .trow{display:flex;align-items:center;gap:8px}
  .phase-name{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);flex:1 1 auto}
  .icon{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 2px rgba(255,218,147,.45)}
  .icon:hover{background:rgba(255,218,147,.14)}
  .icon svg{width:18px;height:18px}
  .phases{display:flex;flex-wrap:wrap;gap:6px}
  .ph{padding:7px 12px;border-radius:999px;font-size:14px;font-weight:700;color:var(--white);box-shadow:inset 0 0 0 2px rgba(255,218,147,.45)}
  .ph b{color:var(--gold);margin-left:4px;font-variant-numeric:tabular-nums}
  .ph:hover{background:rgba(255,218,147,.14)}
  .ph[aria-pressed="true"]{background:var(--gold);color:var(--ink);box-shadow:none}
  .ph[aria-pressed="true"] b{color:var(--ink)}
  .track{grid-column:1 / -1;height:6px;border-radius:3px;background:rgba(255,218,147,.2);overflow:hidden}
  .track i{display:block;height:100%;width:100%;background:var(--gold);transform-origin:left center}
  .timer.warn{background:rgba(127,29,29,.6);box-shadow:inset 0 0 0 2px rgba(239,68,68,.7)}
  .timer.warn .clock{color:#FECACA}
  .timer.warn .track i{background:#FCA5A5}
  .timer.done{background:var(--red-deep);box-shadow:inset 0 0 0 2px rgba(239,68,68,.9)}
  .timer.blink{animation:blink .5s steps(1) infinite}
  @keyframes blink{50%{background:#DC2626}}

  /* ---------- режим сцены: таймер на весь экран ---------- */
  html.stage-on, html.stage-on body{height:100%;overflow:hidden}
  .stage-on header, .stage-on .tour-head, .stage-on .controls, .stage-on footer, .stage-on .flower-card{display:none !important}
  .stage-on main{height:100vh;padding:2.2vh 2.2vw;gap:2vh;justify-content:flex-start}
  .stage-on .bar{display:flex;flex:1 1 auto;min-height:0}

  /* имя и задание — компактная плашка сверху */
  .stage-on .reels, .stage-on .reels.three{grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:1.6vw;flex:0 0 auto}
  .stage-on .reel{
    min-height:0;padding:44px 26px 20px;border-radius:22px;
    background:rgba(110,42,5,.45) !important;color:var(--white);box-shadow:inset 0 0 0 2px var(--line) !important;
  }
  .stage-on .reel::before, .stage-on .reel::after{display:none}
  .stage-on .reel .kicker{top:16px;left:26px;right:26px;color:var(--gold)}
  .stage-on .reel .kicker i{background:var(--gold);box-shadow:0 0 0 4px rgba(255,218,147,.2)}
  .stage-on .value{transform:none !important}
  .stage-on .person .nm, .stage-on .mode-pair .person .nm{font-size:clamp(22px,2.3vw,40px)}
  .stage-on .meta{color:var(--gold)}
  .stage-on .team.W{background:var(--gold);color:var(--ink)}
  .stage-on .team.M{background:var(--ink);color:var(--gold)}
  .stage-on .person{gap:6px}
  .stage-on .person + .person{margin-top:8px;padding-top:8px;border-top:2px dashed rgba(255,218,147,.3)}
  .stage-on #taskValue{font-size:clamp(18px,1.9vw,32px)}
  .stage-on .mode-story #taskValue{font-size:clamp(16px,1.45vw,24px)}
  .stage-on .topic{font-size:clamp(18px,1.9vw,30px)}
  .stage-on .words{margin-top:10px}
  .stage-on .sec, .stage-on .words small{display:none}
  .stage-on .words span{background:var(--gold);color:var(--ink);font-size:clamp(15px,1.4vw,22px);padding:4px 14px}

  /* сам таймер — главный акцент */
  .stage-on .timer{
    flex:1 1 auto;min-height:0;cursor:default;border-radius:32px;padding:2.4vh 3vw 2.6vh;
    grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto auto;
    grid-template-areas:"trow" "clock" "track" "phases" "keys";
    gap:1.8vh;justify-items:stretch;
    background:linear-gradient(180deg,#FFE3AA 0%,#FFD488 100%);color:var(--ink);
    box-shadow:0 30px 80px -30px rgba(60,22,3,.8);
  }
  .stage-on .timer .trow{gap:10px}
  .stage-on .phase-name{font-size:clamp(18px,2.1vw,34px);letter-spacing:.12em;color:var(--orange-deep)}
  .stage-on .icon{width:52px;height:52px;box-shadow:inset 0 0 0 2px rgba(110,42,5,.35);color:var(--ink)}
  .stage-on .icon:hover{background:rgba(110,42,5,.1)}
  .stage-on .icon svg{width:24px;height:24px}
  .stage-on .clock{
    align-self:center;justify-self:center;text-align:center;min-width:0;
    font-size:min(44vh,31vw);line-height:.86;letter-spacing:-.04em;color:var(--ink);
    cursor:pointer;
  }
  .stage-on .track{height:clamp(14px,2.2vh,26px);border-radius:999px;background:rgba(110,42,5,.16)}
  .stage-on .track i{background:linear-gradient(90deg,var(--orange-deep),var(--orange));border-radius:999px}
  .stage-on .phases{justify-content:center;gap:10px}
  .stage-on .ph{font-size:clamp(15px,1.3vw,20px);padding:9px 18px;color:var(--ink);box-shadow:inset 0 0 0 2px rgba(110,42,5,.35)}
  .stage-on .ph b{color:var(--orange-deep)}
  .stage-on .ph:hover{background:rgba(110,42,5,.08)}
  .stage-on .ph[aria-pressed="true"]{background:var(--ink);color:var(--gold)}
  .stage-on .ph[aria-pressed="true"] b{color:var(--gold)}
  .stage-on .stage-keys{display:block;grid-area:keys;text-align:center;font-size:14px;color:var(--orange-deep)}
  .stage-on .stage-keys kbd{background:rgba(110,42,5,.12)}

  /* последние секунды и конец — вся сцена красная */
  .stage-on .timer.warn{background:linear-gradient(180deg,#DC2626 0%,#B91C1C 100%);color:#fff;box-shadow:0 0 0 6px rgba(254,202,202,.5), 0 30px 80px -30px rgba(60,22,3,.8)}
  .stage-on .timer.warn .clock{color:#fff;animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.04)}}
  .stage-on .timer.done{background:var(--red-deep);color:#fff}
  .stage-on .timer.done .clock{color:#fff;font-size:min(30vh,19vw);letter-spacing:.02em}
  .clock.long{font-size:clamp(28px,2.7vw,44px);line-height:1.02;width:min-content;min-width:0}
  .stage-on .timer.done .clock.long{font-size:min(19vh,11.5vw);line-height:.95}
  .stage-on .timer.warn .phase-name, .stage-on .timer.done .phase-name,
  .stage-on .timer.warn .stage-keys, .stage-on .timer.done .stage-keys{color:#FECACA}
  .stage-on .timer.warn .icon, .stage-on .timer.done .icon,
  .stage-on .timer.warn .ph, .stage-on .timer.done .ph{color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.45)}
  .stage-on .timer.warn .ph b, .stage-on .timer.done .ph b{color:#FECACA}
  .stage-on .timer.warn .ph[aria-pressed="true"], .stage-on .timer.done .ph[aria-pressed="true"]{background:#fff;color:var(--red-deep)}
  .stage-on .timer.warn .ph[aria-pressed="true"] b, .stage-on .timer.done .ph[aria-pressed="true"] b{color:var(--red-deep)}
  .stage-on .timer.warn .track, .stage-on .timer.done .track{background:rgba(255,255,255,.2)}
  .stage-on .timer.warn .track i{background:#fff}
  .stage-on .timer.warn .stage-keys kbd, .stage-on .timer.done .stage-keys kbd{background:rgba(255,255,255,.18);color:#fff}
  .stage-on .timer.blink{animation:blink .5s steps(1) infinite}

  /* ---------- подвал ---------- */
  footer{
    flex:0 0 auto;padding:12px 32px 22px;
    display:flex;gap:12px 22px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:15px;
  }
  #progress{white-space:nowrap}
  #progress b{color:var(--gold)}
  #history{display:flex;flex-wrap:wrap;gap:8px;max-height:76px;overflow:auto;flex:1 1 300px;list-style:none}
  #history li{
    background:rgba(110,42,5,.38);border-radius:999px;padding:6px 14px;font-size:14px;
    max-width:460px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  #history li span{color:var(--gold)}
  .foot-actions{display:flex;gap:8px;flex-wrap:wrap}

  .sheet{

  }
  .sheet.open{display:flex}
  .sheet-inner{
    background:var(--bg-deep);border-radius:var(--radius);
    width:min(1000px,100%);max-height:90vh;overflow:auto;padding:30px 32px;
    box-shadow:inset 0 0 0 2px var(--line), 0 30px 80px rgba(0,0,0,.5);
  }
  .sheet h2{font-size:26px;font-weight:800;margin-bottom:6px}
  .sheet .lead{color:var(--gold);margin-bottom:22px;font-size:16px;line-height:1.5}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:22px}
  .col h3{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:18px;font-weight:800;margin-bottom:10px}
  .need{font-size:15px;font-weight:700;padding:3px 12px;border-radius:999px;background:rgba(255,218,147,.18);color:var(--gold);white-space:nowrap}
  .need.ok{background:var(--gold);color:var(--ink)}
  .need.over{background:var(--red-deep);color:#FECACA}
  .pick{
    display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:14px;margin-bottom:8px;
    background:var(--panel);cursor:pointer;transition:background .12s ease;
  }
  .pick:hover{background:var(--panel-hi)}
  .pick.on{background:var(--gold);color:var(--ink)}
  .pick:not(.on){background:rgba(110,42,5,.35)}
  .pick:not(.on) .who{opacity:.6}
  .pick:not(.on) .who b{text-decoration:line-through;text-decoration-thickness:2px}
  .pick:not(.on) .who small::after{content:" · выбыл(а)"}
  .pick input{width:22px;height:22px;accent-color:var(--ink);cursor:pointer;flex:0 0 auto}
  .pick .who{display:flex;flex-direction:column;gap:2px;min-width:0}
  .pick .who b{font-size:16px}
  .pick .who small{font-size:13px;opacity:.8}
  .sheet-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px;align-items:center}
  .save{background:var(--gold);color:var(--ink);font-weight:800;font-size:17px;padding:14px 30px;border-radius:999px}
  .save:hover{background:var(--gold-hi)}
  .danger{margin-left:auto;color:#FECACA;font-size:14px;font-weight:600;text-decoration:underline;padding:8px}

  @media (max-width:1100px){
    .bar{grid-template-columns:1fr}
    .reels.three{grid-template-columns:1fr 1fr}
    .reels.three .flower-card{grid-column:1 / -1;order:3;min-height:0}
  }
  @media (max-width:820px){
    .reels, .reels.three{grid-template-columns:1fr}
    .cols{grid-template-columns:1fr}
    header{padding:14px 16px 4px}
    main{padding:6px 16px 6px}
    .reel{padding:52px 20px 28px}
    .reel .kicker{left:20px;right:20px}
    .spin{font-size:22px;padding:18px 40px}
    footer{padding:12px 16px 20px}
    .sheet{padding:10px}
    .sheet-inner{padding:22px}
  }
  @media (max-width:560px){
    .chip .lbl, .tab span{display:none}
    .chip{padding:9px 11px}
    .tab{padding:6px}
  }
  @media (prefers-reduced-motion:reduce){
    .value{transition:none}
    .spin.busy svg{animation:none}

  }
  @media (max-width:820px){
    .stage-on .reels, .stage-on .reels.three{grid-template-columns:1fr}
  }

      for (var k = 1; k <= 5; k++){
        if (!s.roster[k] || !d.draws || !Array.isArray(d.draws[k])) continue;
        var T = TOURS[k - 1];
        s.draws[k] = d.draws[k].filter(function(x){
          var p = x && validIds(x.p);
          if (!p || !p.length) return false;
          if (T.tasks && !(typeof x.k === 'number' && x.k >= 0 && x.k < T.tasks.length)) return false;
          return true;
        }).map(function(x){ return { p: validIds(x.p), k: T.tasks ? x.k : null }; });
      }
      var tour = Number(d.tour);
      s.tour = (tour >= 1 && tour <= 5 && s.roster[tour]) ? tour : 1;
      s.lang = d.lang === 'ru' ? 'ru' : 'kz';
      state = s;
    } catch(e){}
  }

  /* ---------- звук ---------- */
  var actx = null;
  function ctx(){
    if (!actx){
      var C = window.AudioContext || window.webkitAudioContext;
      if (C) actx = new C();
    }
    if (actx && actx.state === 'suspended') actx.resume();
    return actx;
  }
  function beep(freq, dur, vol){
    if (!state.sound) return;
    var a = ctx(); if (!a) return;
    var o = a.createOscillator(), g = a.createGain();
    o.type = 'triangle'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
    o.connect(g); g.connect(a.destination);
    o.start(); o.stop(a.currentTime + dur);
  }
  function chord(){
    [523.25, 659.25, 783.99].forEach(function(f, i){ setTimeout(function(){ beep(f, 0.45, 0.14); }, i * 70); });
  }
  function gong(){
    [392, 523.25, 659.25].forEach(function(f, i){ setTimeout(function(){ beep(f, 1.2, 0.18); }, i * 90); });
  }
  function renderSound(){
    el.soundLbl.textContent = state.sound ? 'Звук' : 'Без звука';
    el.soundWaves.style.display = state.sound ? '' : 'none';
    el.soundBtn.setAttribute('aria-pressed', state.sound ? 'true' : 'false');
  }

  /* ---------- помощники ---------- */
  function pick(a){ return a[Math.floor(Math.random() * a.length)]; }
  function shuffle(a){
    for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var x = a[i]; a[i] = a[j]; a[j] = x; }
    return a;
  }
  function tourOf(t){ return TOURS[t - 1]; }
  function roster(t){ return state.roster[t] || null; }
  function draws(t){ return state.draws[t] || (state.draws[t] = []); }
  function remaining(t){
    var used = {};
    draws(t).forEach(function(d){ d.p.forEach(function(id){ used[id] = 1; }); });
    return (roster(t) || []).filter(function(id){ return !used[id]; });
  }
  function freeTasks(t){
    var T = tourOf(t);
    if (!T.tasks) return [];
    var used = {};
    draws(t).forEach(function(d){ if (d.k !== null) used[d.k] = 1; });
    var r = [];
    for (var i = 0; i < T.tasks.length; i++) if (!used[i]) r.push(i);
    return r;
  }
  function byTeam(ids, team){ return ids.filter(function(id){ return BY_ID[id].team === team; }); }

  /* тур 4: пары складываются в танце. Оператор отмечает пару, рандомайзер выбирает только тему.
     Когда осталось двое — это и есть следующая пара, отмечать не нужно. */
  function needPick(t){ return tourOf(t).mode === 'pair' && remaining(t).length > 2; }
  function wFirst(ids){ return byTeam(ids, 'W').concat(byTeam(ids, 'M')); }
  function nextPair(t){
    var rest = remaining(t);
    if (!needPick(t)) return rest.length ? wFirst(rest) : null;
    var sel = pairSel.filter(function(id){ return rest.indexOf(id) !== -1; });
    return sel.length === 2 ? wFirst(sel) : null;
  }
  function togglePick(id){
    if (spinning) return;
    var i = pairSel.indexOf(id);
    if (i !== -1){
      pairSel.splice(i, 1);
    } else {
      var rest = remaining(state.tour), team = BY_ID[id].team;
      var mixed = byTeam(rest, 'W').length && byTeam(rest, 'M').length;
      // в смешанной паре — одна девушка и один парень: повторный выбор из той же команды заменяет прежний
      pairSel = pairSel.filter(function(x){ return rest.indexOf(x) !== -1 && (!mixed || BY_ID[x].team !== team); });
      if (pairSel.length >= 2) pairSel.shift();
      pairSel.push(id);
    }
    renderReels();
    refresh();
  }
  function renderPicker(node, t){
    var rest = remaining(t);
    node.innerHTML = '';
    var box = document.createElement('div'); box.className = 'picker';
    var q = document.createElement('div'); q.className = 'pick-q'; q.textContent = L(KICK.danced);
    var qs = document.createElement('small'); qs.textContent = KICK.danced[other()];
    q.appendChild(qs); box.appendChild(q);
    ['W', 'M'].forEach(function(team){
      var ids = byTeam(rest, team);
      if (!ids.length) return;
      var row = document.createElement('div'); row.className = 'pick-row';
      ids.forEach(function(id){
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'pchip ' + team;
        b.textContent = shortName(id);
        b.setAttribute('aria-pressed', pairSel.indexOf(id) !== -1 ? 'true' : 'false');
        b.addEventListener('click', function(){ togglePick(id); b.blur(); });
        row.appendChild(b);
      });
      box.appendChild(row);
    });
    node.appendChild(box);
  }
  function shortName(id){ return BY_ID[id].name.split(' ').slice(0, 2).join(' '); }
  function taskText(T, k){
    if (!T.tasks) return T.fixedTask;
    var x = T.tasks[k];
    return typeof x === 'string' ? x : x.topic + ' (' + x.words.join(', ') + ')';
  }

  /* ---------- отрисовка карточек ---------- */
  function renderPeople(node, ids){
    node.innerHTML = '';
    ids.forEach(function(id){
      var p = BY_ID[id];
      var box = document.createElement('div'); box.className = 'person';
      var nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = p.name;
      var meta = document.createElement('div'); meta.className = 'meta';
      var tm = document.createElement('span'); tm.className = 'team ' + p.team; tm.textContent = TEAM[p.team];
      var br = document.createElement('span'); br.textContent = state.lang === 'kz' ? BRANCH_KZ[p.branch] : p.branch;
      meta.appendChild(tm); meta.appendChild(br);
      box.appendChild(nm); box.appendChild(meta);
      node.appendChild(box);
    });
  }
  function textPair(cls, pair){
    var box = document.createElement('div'); box.className = cls;
    var pri = document.createElement('div'); pri.className = 'pri'; pri.textContent = pair[state.lang];
    var sec = document.createElement('div'); sec.className = 'sec'; sec.textContent = pair[other()];
    box.appendChild(pri); box.appendChild(sec);

  }
  function renderTask(node, T, k){
    node.innerHTML = '';
    if (T.mode === 'flower'){
      var x = T.tasks[k];
      node.appendChild(textPair('topic', { ru: x.topic, kz: x.topicKz }));
      var ws = document.createElement('div'); ws.className = 'words';
      x.words.forEach(function(w, i){

        var sm = document.createElement('small'); sm.textContent = pair[other()];
        s.appendChild(b);

        ws.appendChild(s);

  function setReel(reel, cls){

  /* ---------- цветок ---------- */
  var SVGNS = 'http://www.w3.org/2000/svg';
  var petals = [];
  var flowerCount = null;
  function buildFlower(){
    for (var i = 0; i < 12; i++){
      var a = i * 30;
      var g = document.createElementNS(SVGNS, 'g'); g.setAttribute('class', 'petal');
      var e = document.createElementNS(SVGNS, 'ellipse');
      e.setAttribute('cx', 0); e.setAttribute('cy', -62); e.setAttribute('rx', 19); e.setAttribute('ry', 40);
      e.setAttribute('transform', 'rotate(' + a + ')');
      var tx = document.createElementNS(SVGNS, 'text');
      var rad = a * Math.PI / 180;
      tx.setAttribute('x', (72 * Math.sin(rad)).toFixed(1));
      tx.setAttribute('y', (-72 * Math.cos(rad)).toFixed(1));
      tx.textContent = i + 1;
      g.appendChild(e); g.appendChild(tx);

    var c = document.createElementNS(SVGNS, 'circle');
    c.setAttribute('r', 26); c.setAttribute('class', 'flower-core');

    el.flower.appendChild(flowerCount);
  }
  function paintFlower(currentK, hotK){
    var open = {};
    draws(2).forEach(function(d){ open[d.k] = 1; });
    petals.forEach(function(g, i){
      var cls = 'petal';
      if (i === currentK) cls += ' current';
      else if (open[i]) cls += ' open';
      else if (i === hotK) cls += ' hot';
      g.setAttribute('class', cls);
    });
    flowerCount.textContent = draws(2).length + '/12';
  }

  /* ---------- вкладки и экран тура ---------- */
  function renderTabs(){
    el.tabs.innerHTML = '';
    TOURS.forEach(function(T){
      var b = document.createElement('button');
      b.className = 'tab';
      b.disabled = !roster(T.n);

  function renderTour(){
    var t = state.tour, T = tourOf(t);

  // подписи, зависящие от главного языка
  function renderLabels(){
    var T = tourOf(state.tour);
    var kz = state.lang === 'kz' || T.kzOnly;   // kzOnly — название только на казахском
    el.tourTitle.textContent = kz ? T.titleKz : T.title;
    el.tourTitleSec.textContent = T.kzOnly ? '' : (kz ? T.title : T.titleKz);
    el.nameKick.textContent = both(T.nameKick);
    el.taskKick.textContent = both(T.taskKick);
    el.flowerKick.textContent = both(KICK.flower);
    el.langPri.textContent = state.lang === 'kz' ? 'ҚАЗ' : 'РУС';
    el.langSec.textContent = state.lang === 'kz' ? 'РУС' : 'ҚАЗ';
  }
  // содержимое карточек — заново, без повторного розыгрыша
  function renderReels(){
    var T = tourOf(state.tour);

      renderPeople(el.nameValue, shown.p);
      if (T.tasks) renderTask(el.taskValue, T, shown.k);
    } else {
      var t = state.tour;
      if (T.mode === 'pair' && remaining(t).length){
        // пара не разыгрывается: выбор оператора или оставшиеся двое — сразу видны
        if (needPick(t)) renderPicker(el.nameValue, t);
        else renderPeople(el.nameValue, nextPair(t));
        if (!spinning) setReel(el.nameReel, 'revealed');
      } else {
        el.nameValue.textContent = L(T.nameKick);
      }
      if (T.tasks) el.taskValue.textContent = L(T.taskKick);
    }
    if (!T.tasks) renderTask(el.taskValue, T, null);
  }
  function toggleLang(){
    if (spinning) return;
    state.lang = other();
    persist();
    renderLabels();
    renderTabs();
    renderReels();
    renderPhaseLabels();
    renderTimer();
  }

  function clearScreen(){
    if (spinning) return;
    var T = tourOf(state.tour);
    shown = null;
    setReel(el.nameReel, 'idle');
    el.nameNo.textContent = '';
    setReel(el.taskReel, T.mode === 'order' ? 'revealed' : 'idle');
    renderReels();
    if (T.mode === 'flower') paintFlower(-1, -1);
    el.spinLbl.textContent = T.spin;
  }

  function refresh(){
    var t = state.tour, T = tourOf(t);
    var list = draws(t), rest = remaining(t), total = roster(t).length;
    var spoke = total - rest.length;

    el.progress.innerHTML = '';
    el.progress.append('Выступили: ');
    var b = document.createElement('b'); b.textContent = spoke + ' из ' + total;
    el.progress.append(b);

    el.history.innerHTML = '';
    list.forEach(function(d, i){
      var li = document.createElement('li');
      var who = d.p.map(shortName).join(' и ');
      li.textContent = (i + 1) + '. ' + who + ' ';
      var s = document.createElement('span');
      s.textContent = T.tasks ? '— ' + (T.mode === 'flower' ? T.tasks[d.k].topic : T.tasks[d.k]) : '';
      li.appendChild(s);
      li.title = who + (T.tasks ? ' — ' + taskText(T, d.k) : '');
      el.history.appendChild(li);
    });

    var tasksLeft = !T.tasks || freeTasks(t).length > 0;
    // тур 4: крутить можно, когда пара отмечена (или на экране прошлая пара — тогда кнопка вернет выбор)
    var ready = rest.length > 0 && tasksLeft && (T.mode !== 'pair' || !!nextPair(t) || !!shown);
    el.spinBtn.disabled = !ready || spinning;
    el.undoBtn.disabled = !list.length || spinning;

    if (T.pass){
      el.selectBtn.hidden = false;
      el.selectLbl.textContent = roster(t + 1) ? 'Изменить состав тура ' + (t + 1) : 'Итоги тура → отбор в тур ' + (t + 1);
    } else {
      el.selectBtn.hidden = true;
    }

    if (!rest.length){
      el.hint.innerHTML = T.pass
        ? 'Все выступили. Нажмите <b>«Итоги тура»</b> и отметьте, кто проходит дальше'
        : 'Очередность определена. Удачи финалистам!';
    } else if (!tasksLeft){

    } else {

  }

  function goTour(t){
    if (spinning || t === state.tour || !roster(t)) return;
    state.tour = t;
    persist();
    renderTour();
  }

  /* ---------- розыгрыш ---------- */
  function planDraw(t){
    var T = tourOf(t), rest = remaining(t);
    if (!rest.length) return null;
    var p;
    if (T.mode === 'pair'){
      p = nextPair(t);   // пару определил танец, а не рандомайзер
      if (!p) return null;
    } else {
      p = [pick(rest)];
    }
    var k = null;
    if (T.tasks){
      var free = freeTasks(t);
      if (!free.length) return null;
      k = pick(free);

    return { p: p, k: k };
  }

  function runReel(reel, frame, final, duration, done){
    setReel(reel, 'spinning');

        final();

  function spin(){
    if (spinning) return;

    if (!plan){

      if (T.mode === 'pair' && shown){ clearScreen(); refresh(); }
      return;
    }
    pairSel = [];

    setStage(false);
    spinning = true;
    ctx();
    resetTimer();
    el.spinBtn.disabled = true;
    el.undoBtn.disabled = true;
    el.spinBtn.classList.add('busy');
    el.spinLbl.textContent = 'Крутится…';
    el.nameNo.textContent = '';

    var pool = remaining(t);
    if (pool.length < 2) pool = roster(t);
    var pairMode = T.mode === 'pair';
    var pending = (T.tasks ? 1 : 0) + (pairMode ? 0 : 1);

    function finished(){
      pending -= 1;
      if (pending > 0) return;
      draws(t).push(plan);
      shown = plan;
      spinning = false;
      el.spinBtn.classList.remove('busy');
      el.spinLbl.textContent = rest() ? (pairMode ? 'Следующая пара' : 'Крутить дальше') : T.spin;
      el.nameNo.textContent = '№ ' + draws(t).length;

        function(){ renderPeople(el.nameValue, plan.p); },

        function(){

  }

  function undo(){

    list.pop();
    persist();
    clearScreen();
    refresh();
  }

  /* ---------- отбор между турами ---------- */
  var selT = 0;
  function openSelect(){
    var t = state.tour, T = tourOf(t);
    if (!T.pass || spinning) return;
    selT = t;
    var next = roster(t + 1);   // нет состава — по умолчанию отмечены все
    el.selectTitle.textContent = 'Итоги тура ' + t + ' · кто проходит в тур ' + (t + 1);
    el.selectLead.textContent = 'Снимите отметку с выбывших по решению жюри. По регламенту дальше идут ' +
      T.pass.W + ' из Women’s Space и ' + T.pass.M + ' из Batyr. В рандомайзер тура ' + (t + 1) + ' попадут только отмеченные.';
    el.selectOk.textContent = 'Перейти к туру ' + (t + 1);
    [['W', el.listW], ['M', el.listM]].forEach(function(pair){
      var team = pair[0], box = pair[1];
      box.innerHTML = '';
      byTeam(roster(t), team).forEach(function(id){
        var p = BY_ID[id];
        var lab = document.createElement('label'); lab.className = 'pick';
        var cb = document.createElement('input'); cb.type = 'checkbox'; cb.value = id; cb.dataset.team = team;
        cb.checked = next ? next.indexOf(id) !== -1 : true;
        var who = document.createElement('span'); who.className = 'who';
        var nm = document.createElement('b'); nm.textContent = p.name;
        var sm = document.createElement('small'); sm.textContent = p.branch;

  }
  function checkedIds(){
    return Array.prototype.map.call(el.selectSheet.querySelectorAll('input:checked'), function(c){ return Number(c.value); });
  }
  function updateNeed(){
    var T = tourOf(selT);
    Array.prototype.forEach.call(el.selectSheet.querySelectorAll('.pick'), function(l){
      l.classList.toggle('on', l.querySelector('input').checked);
    });
    var ids = checkedIds();
    [['W', el.needW], ['M', el.needM]].forEach(function(pair){
      var n = byTeam(ids, pair[0]).length, need = T.pass[pair[0]];
      pair[1].textContent = n === need ? 'проходят ' + n + ' ✓'
        : n > need ? 'уберите еще ' + (n - need) + ' · проходят ' + need
        : 'лишний выбывший: верните ' + (need - n);
      pair[1].className = 'need' + (n === need ? ' ok' : (n < need ? ' over' : ''));
    });
  }
  function applySelect(){
    var t = selT, T = tourOf(t);
    var ids = checkedIds();
    if (!ids.length){ alert('Отметьте хотя бы одного участника.'); return; }
    var w = byTeam(ids, 'W').length, m = byTeam(ids, 'M').length;
    if ((w !== T.pass.W || m !== T.pass.M) &&
        !confirm('Выбрано: Women’s Space — ' + w + ', Batyr — ' + m + '.\nПо регламенту нужно ' + T.pass.W + ' и ' + T.pass.M + '.\nВсе равно перейти к туру ' + (t + 1) + '?')) return;

    state.roster[t + 1] = ALL_IDS.filter(function(id){ return ids.indexOf(id) !== -1; });
    // поздние туры не могут содержать выбывших
    for (var k = t + 2; k <= 5; k++){
      if (!state.roster[k]) break;
      var prev = state.roster[k - 1];
      state.roster[k] = state.roster[k].filter(function(id){ return prev.indexOf(id) !== -1; });
      if (!state.roster[k].length){ for (var z = k; z <= 5; z++){ delete state.roster[z]; delete state.draws[z]; } break; }
    }
    for (var j = t + 1; j <= 5; j++){
      if (!state.draws[j]) continue;
      var r = state.roster[j] || [];
      state.draws[j] = state.draws[j].filter(function(d){ return d.p.every(function(id){ return r.indexOf(id) !== -1; }); });
    }
    state.tour = t + 1;
    persist();
    closeSheets();
    renderTour();
  }

  function closeSheets(){
    el.selectSheet.classList.remove('open');
  }
  function sheetOpen(){
    return el.selectSheet.classList.contains('open');
  }

  /* ---------- таймер ---------- */
  var tm = { phases: [], idx: 0, total: 0, remaining: 0, endAt: 0, mode: 'idle', lastSec: null, backup: null, blinkT: null };
  var wakeLock = null;
  function lockScreen(){
    if (!('wakeLock' in navigator) || wakeLock) return;
    navigator.wakeLock.request('screen').then(function(l){
      wakeLock = l; l.addEventListener('release', function(){ wakeLock = null; });
    }).catch(function(){});
  }
  function unlockScreen(){ if (wakeLock){ try { wakeLock.release(); } catch(e){} wakeLock = null; } }

  function fmt(ms){
    var s = Math.ceil(ms / 1000), m = Math.floor(s / 60), r = s % 60;
    return m + ':' + (r < 10 ? '0' : '') + r;
  }
  function tRemaining(){ return tm.mode === 'running' ? Math.max(0, tm.endAt - performance.now()) : tm.remaining; }

  function setPhases(list){
    tm.phases = list;
    el.phases.innerHTML = '';
    list.forEach(function(ph, i){
      var b = document.createElement('button');
      b.className = 'ph';
      b.title = 'Клавиша ' + (i + 1) + ' — запустить';
      var n = document.createElement('span'); n.className = 'ph-name';
      var s = document.createElement('b'); s.textContent = fmt(ph.s * 1000);
      b.appendChild(n); b.appendChild(s);
      b.addEventListener('click', function(){ setStage(true); selectPhase(i, true); });
      el.phases.appendChild(b);
    });
    renderPhaseLabels();
    el.stageKeysN.textContent = list.length;
    $('stageKeysMore').hidden = list.length < 2;
    selectPhase(0, false);
  }
  function renderPhaseLabels(){
    Array.prototype.forEach.call(el.phases.children, function(b, i){
      b.querySelector('.ph-name').textContent = L(tm.phases[i].name);
    });
  }
  function selectPhase(i, autostart){
    if (!tm.phases[i]) return;
    stopTimer();
    tm.idx = i;
    tm.total = tm.remaining = tm.phases[i].s * 1000;
    tm.mode = 'idle';
    renderTimer();
    if (autostart) startTimer();
  }
  function renderTimer(){
    var rem = tRemaining();
    var ph = tm.phases[tm.idx];
    el.clock.textContent = tm.mode === 'done' ? L(TIME_UP) : fmt(rem);
    el.clock.classList.toggle('long', el.clock.textContent.length > 8);   // «УАҚЫТ АЯҚТАЛДЫ» — в две строки
    el.phaseName.textContent = (ph ? L(ph.name) : 'Таймер') + ' · ' + L(STATUS[tm.mode]);
    el.tBar.style.transform = 'scaleX(' + (tm.total ? rem / tm.total : 0) + ')';
    var warnAt = tm.total >= 60000 ? 10 : 5;
    var secLeft = Math.ceil(rem / 1000);
    el.timer.classList.toggle('warn', (tm.mode === 'running' || tm.mode === 'paused') && secLeft <= warnAt);
    el.timer.classList.toggle('done', tm.mode === 'done');
    el.tIcon.innerHTML = tm.mode === 'running' ? '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
    Array.prototype.forEach.call(el.phases.children, function(b, i){
      b.setAttribute('aria-pressed', i === tm.idx ? 'true' : 'false');
    });
  }
  function loop(){
    if (tm.mode !== 'running') return;
    var rem = tm.endAt - performance.now();
    var sec = Math.ceil(rem / 1000);
    if (sec !== tm.lastSec){
      tm.lastSec = sec;
      if (sec > 0 && sec <= 5) beep(sec === 1 ? 990 : 880, 0.12, 0.12);
    }
    if (rem <= 0){ finishTimer(); return; }
    renderTimer();
    requestAnimationFrame(loop);
  }
  function startTimer(){
    if (tm.mode === 'done'){ tm.remaining = tm.total; }
    if (tm.remaining <= 0) return;
    ctx();
    clearTimeout(tm.blinkT); el.timer.classList.remove('blink');
    tm.endAt = performance.now() + tm.remaining;
    tm.mode = 'running';
    tm.lastSec = Math.ceil(tm.remaining / 1000);
    lockScreen();
    renderTimer();
    requestAnimationFrame(loop);
    clearInterval(tm.backup);
    tm.backup = setInterval(function(){
      if (tm.mode !== 'running'){ clearInterval(tm.backup); return; }
      if (tm.endAt - performance.now() <= 0) finishTimer();
    }, 250);
  }
  function pauseTimer(){
    if (tm.mode !== 'running') return;
    tm.remaining = Math.max(0, tm.endAt - performance.now());
    tm.mode = 'paused';
    clearInterval(tm.backup);
    unlockScreen();
    renderTimer();
  }
  function toggleTimer(){ tm.mode === 'running' ? pauseTimer() : startTimer(); }
  function finishTimer(){
    if (tm.mode !== 'running') return;
    clearInterval(tm.backup);
    tm.mode = 'done'; tm.remaining = 0;
    unlockScreen();
    gong();
    renderTimer();
    el.timer.classList.add('blink');
    clearTimeout(tm.blinkT);
    tm.blinkT = setTimeout(function(){ el.timer.classList.remove('blink'); }, 3000);
  }
  function stopTimer(){
    clearInterval(tm.backup);
    clearTimeout(tm.blinkT);
    el.timer.classList.remove('blink');
    unlockScreen();
  }
  function resetTimer(){ selectPhase(tm.idx, false); }

  /* ---------- события ---------- */
  el.spinBtn.addEventListener('click', spin);
  el.undoBtn.addEventListener('click', undo);
  el.selectBtn.addEventListener('click', openSelect);
  el.selectOk.addEventListener('click', applySelect);
  $('selectCancel').addEventListener('click', closeSheets);
  $('resetAll').addEventListener('click', function(){
    if (spinning) return;   // не сбрасывать посреди прокрутки — иначе результат запишется в новый турнир
    if (!confirm('Сбросить все туры, результаты розыгрышей и отбора? Это нельзя отменить.')) return;
    state = freshState(state.sound);
    persist();
    closeSheets();
    renderTour();
  });
  el.selectSheet.addEventListener('click', function(e){ if (e.target === el.selectSheet) closeSheets(); });
  // клик по таймеру: развернуть на весь экран и запустить; на сцене — пауза / продолжить
  el.clock.addEventListener('click', function(e){
    e.stopPropagation();
    if (!stageOn()){
      setStage(true);
      if (tm.mode !== 'running') startTimer();
    } else {
      toggleTimer();
    }
  });
  el.timer.addEventListener('click', function(e){
    if (!stageOn() && !e.target.closest('button')) setStage(true);
  });
  el.tStage.addEventListener('click', function(){ setStage(!stageOn()); });
  $('langBtn').addEventListener('click', toggleLang);
  el.tToggle.addEventListener('click', toggleTimer);
  el.tReset.addEventListener('click', resetTimer);
  el.soundBtn.addEventListener('click', function(){ state.sound = !state.sound; renderSound(); persist(); });
  el.fsBtn.addEventListener('click', function(){
    if (document.fullscreenElement){ document.exitFullscreen(); }
    else if (document.documentElement.requestFullscreen){ document.documentElement.requestFullscreen(); }
  });

  document.addEventListener('keydown', function(e){
    if (sheetOpen()){
      if (e.key === 'Escape') closeSheets();
      return;
    }
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var tag = e.target && e.target.tagName;
    var onControl = tag === 'BUTTON' || tag === 'A';
    var m = /^(?:Digit|Numpad)([1-9])$/.exec(e.code);
    if (e.code === 'KeyL'){ toggleLang(); return; }
    if (stageOn()){
      // на сцене пробел управляет таймером, чтобы случайно не крутить барабан
      if (e.key === 'Escape'){ setStage(false); return; }
      if (e.code === 'Space'){ e.preventDefault(); toggleTimer(); return; }
      if (e.key === 'Enter'){ if (!onControl) e.preventDefault(); return; }
      if (m){ selectPhase(Number(m[1]) - 1, true); return; }
      if (e.code === 'KeyP'){ toggleTimer(); return; }
      if (e.code === 'KeyR'){ resetTimer(); return; }
      if (e.code === 'KeyF'){ el.fsBtn.click(); return; }
      return;
    }
    if (e.code === 'Space' || (e.key === 'Enter' && !onControl)){ e.preventDefault(); spin(); return; }
    if (m && tm.phases[Number(m[1]) - 1]){ setStage(true); selectPhase(Number(m[1]) - 1, true); return; }
    if (e.code === 'KeyT'){ setStage(true); return; }
    if (e.code === 'KeyP'){ toggleTimer(); return; }
    if (e.code === 'KeyR'){ resetTimer(); return; }
    if (e.code === 'KeyC'){ clearScreen(); return; }
    if (e.code === 'KeyF'){ el.fsBtn.click(); return; }
    if (e.key === 'ArrowRight'){ goTour(state.tour + 1); return; }
    if (e.key === 'ArrowLeft'){ goTour(state.tour - 1); return; }
  });
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'visible' && tm.mode === 'running') lockScreen();
  });

  /* ---------- старт ---------- */
  buildFlower();
  restore();
  renderSound();
  renderTour();
})();
</script>
</body>
</html>
